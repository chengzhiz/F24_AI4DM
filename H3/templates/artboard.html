{% extends "base.html" %}

{% block content %}

<div id="artboardContainer" class="row g-0">
  <!-- Toolbox Section -->
  <div id="toolbarSection">
    <h5>Tools</h5>
    <div class="tool-icons">
      <button id="cursorTool" class="tool">
        <img src="{{ url_for('static', filename='imgs/cursor.svg') }}" alt="Cursor" title="Cursor Tool">
      </button>
      <button id="penTool" class="tool active">
        <img src="{{ url_for('static', filename='imgs/pen.svg') }}" alt="Pen" title="Pen Tool">
      </button>
      <button id="eraserTool" class="tool">
        <img src="{{ url_for('static', filename='imgs/eraser.svg') }}" alt="Eraser" title="Eraser Tool">
      </button>
      <button id="textTool" class="tool">
        <img src="{{ url_for('static', filename='imgs/text.svg') }}" alt="Text" title="Text Tool">
      </button>
    </div>
  </div>

  <!-- Canvas for Drawing -->
  <div class="col">
    <canvas id="artboard"></canvas>
  </div>

  <!-- Image Generation Section -->
  <div id="imageGenerationSection" class="col-3">
    <h5>Image Generation</h5>

    <div class="mb-1">Please describe what you would like to generate</div>
    <div class="mb-3 d-flex flex-column">
      <!-- Input for image prompt -->
      <input type="text" class="form-control" id="imagePrompt" placeholder="Describe your image..." required>
      <!-- Generate Button -->
      <button id="generateImage" class="btn btn-purple w-100 mt-2">Generate</button>
    </div>

    <!-- Image placeholder -->
    <div id="generatedImageContainer" class="text-center mb-3">
      <div class="placeholder-img"
        style="width: 100%; height: 200px; background-color: #f0f0f0; display: flex; justify-content: center; align-items: center; color: #888;">
        <span>No Image Generated</span>
      </div>
    </div>

    <div class="mb-3 d-flex flex-column">
      <div class="mb-3">
        <button id="addImage" type="submit" class="btn btn-purple w-100">Add Image</button>
      </div>
    </div>

  </div>
</div>

<script>
  const canvas = document.getElementById("artboard");
  const ctx = canvas.getContext("2d");
  const toolIcons = document.querySelectorAll(".tool");
  const projectId = {{ project_id }}; // Pass the project_id from Flask to JavaScript

  let tool = "pen"; // Default tool

  canvas.width = window.innerWidth - 450;
  canvas.height = window.innerHeight - 100;
  let canvasRect = canvas.getBoundingClientRect();

  window.addEventListener("resize", () => {
    canvas.width = window.innerWidth - 450;
    canvas.height = window.innerHeight - 100;
    canvasRect = canvas.getBoundingClientRect();
    drawCanvas(); // Redraw content after resizing
  });

  const cc = JSON.parse('{{ content | tojson | safe }}');
  const userRole = {{ role }}
  console.log(userRole)

  const drawings = cc["drawings"];
  const memos = cc["memos"];

  //const drawings = [];
  //const memos = [];

  let drawing = false;
  let erasing = false;
  let selectedMemo = null;
  let resizingMemo = false;
  let offsetX = 0;
  let offsetY = 0;

  // Clamp the coordinates to canvas boundaries in `getCanvasCoordinates`
  function getCanvasCoordinates(e) {
    const scaleX = canvas.width / canvasRect.width;
    const scaleY = canvas.height / canvasRect.height;
    const x = (e.clientX - canvasRect.left) * scaleX;
    const y = (e.clientY - canvasRect.top) * scaleY;

    return {
      x: Math.min(Math.max(x, 0), canvas.width), // Clamp x to canvas boundaries
      y: Math.min(Math.max(y, 0), canvas.height) // Clamp y to canvas boundaries
    };
  }

  function drawCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Redraw all memos (text and images)
    memos.forEach(drawMemo);

    // Redraw all drawings
    drawings.forEach(path => {
      ctx.beginPath();
      ctx.strokeStyle = path.color;
      ctx.lineWidth = path.size;
      ctx.moveTo(path.points[0].x, path.points[0].y);
      path.points.forEach(point => ctx.lineTo(point.x, point.y));
      ctx.stroke();
    });

    // Redraw all memos (text and images)
    memos.forEach(drawMemo);
  }

  drawCanvas();

  function eraseDrawing(x, y) {
    const eraseRadius = 15; // Increased radius for better erasing

    drawings.forEach((path, pathIndex) => {
      path.points.forEach((point, pointIndex) => {
        if (pointIndex > 0) {
          const prevPoint = path.points[pointIndex - 1];
          if (isPointNearLine(x, y, prevPoint, point, eraseRadius)) {
            path.points.splice(pointIndex, 1); // Remove the point
          }
        }
      });

      // Remove path if it has no points left
      if (path.points.length < 2) {
        drawings.splice(pathIndex, 1);
      }
    });

    drawCanvas(); // Redraw after erasing
  }


  canvas.addEventListener("mousedown", (e) => {
    const { x, y } = getCanvasCoordinates(e);

    if (tool === "pen") {
      drawing = true;
      if (userRole == 1) {
        drawings.push({ color: "purple", size: 2, points: [{ x, y }] });
      } else {
        drawings.push({ color: "orange", size: 2, points: [{ x, y }] });
      }
    } else if (tool === "eraser") {
      erasing = true;
      eraseDrawing(x, y); // Start erasing immediately
    } else if (tool === "text") {
      const text = prompt("Enter your text:");
      if (text) {
        if (userRole == 1) {
          memos.push({ x, y, width: 150, height: 50, text, fontSize: 16 });
        } else {
          memos.push({ x, y, width: 150, height: 50, text, fontSize: 16 });
        }
        drawCanvas();
      }
    } else if (tool === "cursor") {
      selectedMemo = memos.find(memo =>
        x >= memo.x && x <= memo.x + memo.width &&
        y >= memo.y && y <= memo.y + memo.height
      );

      if (selectedMemo) {
        if (x >= selectedMemo.x + selectedMemo.width - 10 &&
          y >= selectedMemo.y + selectedMemo.height - 10) {
          resizingMemo = true;
        } else {
          offsetX = x - selectedMemo.x;
          offsetY = y - selectedMemo.y;
        }
      }
    }
  });


  canvas.addEventListener("mousemove", (e) => {
    const { x, y } = getCanvasCoordinates(e);

    if (tool === "pen" && drawing) {
      const currentPath = drawings[drawings.length - 1];
      currentPath.points.push({ x, y });
      drawCanvas();
    } else if (tool === "eraser" && erasing) {
      eraseDrawing(x, y); // Continuously erase as the mouse moves
    } else if (tool === "cursor" && selectedMemo) {
      if (resizingMemo) {
        selectedMemo.width = Math.max(50, x - selectedMemo.x);
        selectedMemo.height = Math.max(30, y - selectedMemo.y);
      } else {
        selectedMemo.x = Math.min(canvas.width - selectedMemo.width, Math.max(0, x - offsetX));
        selectedMemo.y = Math.min(canvas.height - selectedMemo.height, Math.max(0, y - offsetY));
      }
      drawCanvas();
    }
  });

  canvas.addEventListener("mouseup", () => {
    drawing = false;
    erasing = false; // Stop erasing when the mouse is released
    selectedMemo = null;
    resizingMemo = false;
  });

  // Call saveArtboardState whenever the canvas is updated
  function drawCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear the canvas

    // Redraw all memos (images and text)
    memos.forEach(drawMemo);

    // Redraw all drawings (lines)
    drawings.forEach(path => {
      ctx.beginPath();
      ctx.strokeStyle = path.color;
      ctx.lineWidth = path.size;
      ctx.moveTo(path.points[0].x, path.points[0].y);
      path.points.forEach(point => ctx.lineTo(point.x, point.y));
      ctx.stroke();
    });
    saveArtboardState(); // Save state after drawing
  }

  // Add event listener for tool selection
  document.getElementById("toolbarSection").addEventListener("click", (e) => {
    const clickedTool = e.target.closest(".tool");
    if (clickedTool) {
      // Remove "active" class from all tools
      toolIcons.forEach(icon => icon.classList.remove("active"));

      // Add "active" class to the selected tool
      clickedTool.classList.add("active");

      // Update the tool variable
      tool = clickedTool.id.replace("Tool", "").toLowerCase();
      console.log(`Selected tool: ${tool}`);

      // Reset erasing state
      if (tool !== "eraser") {
        erasing = false; // Stop erasing when another tool is selected
      }
    }
  });

  document.getElementById("generateImage").addEventListener("click", async () => {
    const prompt = document.getElementById("imagePrompt").value;
    const container = document.getElementById("generatedImageContainer");

    if (!prompt || prompt.trim() === "") {
      container.innerHTML = `<div style="color: red;">Prompt cannot be empty.</div>`;
      return;
    }

    // Display loading state
    container.innerHTML = `<div style="color: #888;">Generating image...</div>`;

    try {
      const response = await fetch("/generate_image", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt }),
      });

      const data = await response.json();
      if (response.ok) {
        container.innerHTML = `<img src="${data.image_url}" alt="Generated Image" style="width: 200px; height: 200px;">`;
      } else {
        container.innerHTML = `<div style="color: red;">Error: ${data.error}</div>`;
      }
    } catch (error) {
      container.innerHTML = `<div style="color: red;">Error: ${error.message}</div>`;
    }
  });

  document.getElementById("addImage").addEventListener("click", () => {
    const imgElement = document.querySelector("#generatedImageContainer img");
    if (!imgElement) {
      alert("No image to add!");
      return;
    }

    // Add the image onto the canvas
    const img = new Image();
    img.src = imgElement.src;
    img.onload = () => {
      const memo = {
        x: canvas.width / 4,
        y: canvas.height / 4,
        width: img.width / 2,
        height: img.height / 2,
        image: img,
      };
      memos.push(memo); // Add image to memos array
      drawCanvas(); // Redraw the canvas
    };
  });


  function drawMemo(memo) {
    if (memo.image) {
      // Draw the image
      ctx.drawImage(memo.image, memo.x, memo.y, memo.width, memo.height);
      ctx.fillStyle = "orange";
      ctx.fillRect(memo.x + memo.width - 10, memo.y + memo.height - 10, 10, 10);
    } else {
      // Draw text memo (existing logic)
      ctx.fillStyle = "purple";
      ctx.fillRect(memo.x, memo.y, memo.width, memo.height);
      ctx.fillStyle = "white";
      ctx.font = `${memo.fontSize}px Arial`;
      ctx.fillText(memo.text, memo.x + 10, memo.y + memo.fontSize + 5, memo.width - 20);
      ctx.fillStyle = "orange";
      ctx.fillRect(memo.x + memo.width - 10, memo.y + memo.height - 10, 10, 10);
    }
  }

  // Helper function to check if a point is within a certain distance from a line
  function isPointNearLine(x, y, lineStart, lineEnd, radius) {
    const dx = lineEnd.x - lineStart.x;
    const dy = lineEnd.y - lineStart.y;
    const lineLength = Math.sqrt(dx * dx + dy * dy);
    const lineUnitVector = { x: dx / lineLength, y: dy / lineLength };
    const pointToStart = { x: x - lineStart.x, y: y - lineStart.y };
    const projectionLength = pointToStart.x * lineUnitVector.x + pointToStart.y * lineUnitVector.y;

    const closestPoint = {
      x: lineStart.x + projectionLength * lineUnitVector.x,
      y: lineStart.y + projectionLength * lineUnitVector.y
    };

    const distance = Math.sqrt((closestPoint.x - x) ** 2 + (closestPoint.y - y) ** 2);
    return distance < radius;
  }

  function saveArtboardState() {
    const artboardState = {
      drawings: drawings,
      memos: memos
    };

    console.log("Saving artboard state:", artboardState); // Debug

    fetch(`/save_artboard/${projectId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: artboardState })
    })
      .then(response => {
        if (response.ok) {
          console.log('Artboard saved successfully!');
        } else {
          console.error('Failed to save artboard state.');
        }
      })
      .catch(error => {
        console.error('Error saving artboard state:', error);
      });
  }

  async function loadArtboard(projectId) {
    try {
      const response = await fetch(`/get_artboard/${projectId}`);
      const result = await response.json();

      if (result.success) {
        console.log("Loaded artboard data:", result.data); // Debug
        renderArtboard(result.data);
      } else {
        console.error("Error loading artboard:", result.error);
      }
    } catch (error) {
      console.error("Error fetching artboard:", error);
    }
  }


  function renderArtboard(data) {
    if (data.drawings) {
      console.log("Drawings to render:", data.drawings);
      data.drawings.forEach(renderDrawing);
    }

    if (data.memos) {
      console.log("Memos to render:", data.memos);
      data.memos.forEach(memo => {
        memos.push(memo); // Add memo to memos array
      });
    }

    drawCanvas(); // Redraw everything
  }


  // Example: Render a drawing
  function renderDrawing(drawing) {
    const ctx = canvas.getContext("2d"); // Get canvas context
    ctx.strokeStyle = drawing.color;
    ctx.lineWidth = drawing.size;

    ctx.beginPath();
    for (let i = 0; i < drawing.points.length - 1; i++) {
      const p1 = drawing.points[i];
      const p2 = drawing.points[i + 1];
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
    }
    ctx.stroke();
  }

  // Load the artboard state when the page is loaded
  window.addEventListener('load', loadArtboardState);


</script>

{% endblock %}
