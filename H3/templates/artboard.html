{% extends "base.html" %}
{%block content%}
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    /* Full-page artboard container */
    #artboardContainer {
      display: flex;
      height: 100vh;
      position: relative;
    }

    /* Canvas for Drawing */
    #artboard {
      flex: 1;
      background-color: #f8f9fa;
      border: 1px solid #ddd;
      cursor: crosshair;
      height: 100%;
    }

    /* Image Generation Section on the Right */
    #imageGenerationSection {
      width: 300px;
      background-color: white;
      border-left: 1px solid #ddd;
      padding: 20px;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
      position: relative;
    }

    #imageGenerationSection h2 {
      font-size: 1.2rem;
    }

    #generatedImageContainer img {
      width: 100%;
      height: auto;
    }

    /* Form and Button styles */
    .form-control {
      margin-bottom: 10px;
    }

    .btn {
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <!-- Main Artboard Container -->
  <div id="artboardContainer">
    <!-- Canvas for Drawing -->
    <canvas id="artboard"></canvas>

    <!-- Image Generation Section (always visible) -->
    <div id="imageGenerationSection">
      <h2>Generate Image</h2>
      <div class="mb-3">
        <label for="imagePrompt" class="form-label">Enter Text for Image Generation</label>
        <input type="text" class="form-control" id="imagePrompt" placeholder="Describe your image...">
      </div>
      <button id="generateImage" class="btn btn-primary">Generate Image</button>
      <div id="generatedImageContainer" class="text-center mt-3">
        <!-- Generated image will appear here -->
      </div>
    </div>
  </div>

  <!-- Include necessary JavaScript -->
  <script>
    // Canvas Drawing Logic
    const canvas = document.getElementById("artboard");
    const ctx = canvas.getContext("2d");
    let drawing = false;

    // Set canvas size to full window minus the image generation section
    canvas.width = window.innerWidth - 300;  // Subtracting width of image generation section
    canvas.height = window.innerHeight;

    // Get the canvas position relative to the window
    const canvasRect = canvas.getBoundingClientRect();

    // Start drawing when mouse is pressed
    canvas.addEventListener("mousedown", () => {
      drawing = true;
    });

    // Stop drawing when mouse is released
    canvas.addEventListener("mouseup", () => {
      drawing = false;
      ctx.beginPath();
    });

    // Draw on the canvas
    canvas.addEventListener("mousemove", (e) => {
      if (drawing) {
        // Adjust mouse coordinates relative to the canvas
        const mouseX = e.clientX - canvasRect.left;
        const mouseY = e.clientY - canvasRect.top;

        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.strokeStyle = "black";

        ctx.lineTo(mouseX, mouseY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(mouseX, mouseY);
      }
    });
  </script>
</body>

</html>

{%endblock%}
