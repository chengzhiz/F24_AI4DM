{% extends "base.html" %}

{% block content %}
<div id="artboardContainer" class="row g-0">
  <!-- Toolbox Section -->
  <div id="toolbarSection">
    <h5>Tools</h5>
    <div class="tool-icons">
      <button id="cursorTool" class="tool">
        <img src="{{ url_for('static', filename='imgs/cursor.svg') }}" alt="Cursor" title="Cursor Tool">
      </button>
      <button id="penTool" class="tool active">
        <img src="{{ url_for('static', filename='imgs/pen.svg') }}" alt="Pen" title="Pen Tool">
      </button>
      <button id="eraserTool" class="tool">
        <img src="{{ url_for('static', filename='imgs/eraser.svg') }}" alt="Eraser" title="Eraser Tool">
      </button>
      <button id="textTool" class="tool">
        <img src="{{ url_for('static', filename='imgs/text.svg') }}" alt="Text" title="Text Tool">
      </button>
    </div>
  </div>

  <!-- Canvas for Drawing -->
  <div class="col">
    <canvas id="artboard"></canvas>
  </div>

  <!-- Image Generation Section -->
  <div id="imageGenerationSection" class="col-3">
    <h5>Image Generation</h5>
    <div class="mb-3 d-flex flex-column">
      <div method="POST">
        <div class="mb-3">

          <body>Text in prompt for image generation</body>
        </div>
        <div class="mb-3">
          <input type="text" class="form-control" name="username" placeholder="Username" required>
        </div>
        <button type="submit" class="btn btn-purple w-100">Generate</button>
      </div>
    </div>

    <div id="generatedImageContainer" class="text-center mb-3">
      <div class="placeholder-img"
        style="width: 100%; height: 200px; background-color: #f0f0f0; display: flex; justify-content: center; align-items: center; color: #888;">
        <span>No Image Generated</span>
      </div>
    </div>

    <div class="mb-3 d-flex flex-column">
      <div class="mb-3">
        <button type="submit" class="btn btn-purple w-100">Add Image</button>
      </div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById("artboard");
  const ctx = canvas.getContext("2d");
  const toolIcons = document.querySelectorAll(".tool");
  let tool = "pen"; // Default tool

  canvas.width = window.innerWidth - 450;
  canvas.height = window.innerHeight - 100;
  let canvasRect = canvas.getBoundingClientRect();

  window.addEventListener("resize", () => {
    canvasRect = canvas.getBoundingClientRect();
  });

  const drawings = [];
  const memos = [];
  let drawing = false;
  let erasing = false;
  let selectedMemo = null;
  let resizingMemo = false;
  let offsetX = 0;
  let offsetY = 0;

  function getCanvasCoordinates(e) {
    const scaleX = canvas.width / canvasRect.width;
    const scaleY = canvas.height / canvasRect.height;
    return {
      x: (e.clientX - canvasRect.left) * scaleX,
      y: (e.clientY - canvasRect.top) * scaleY,
    };
  }

  function drawCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawings.forEach(path => {
      ctx.beginPath();
      ctx.strokeStyle = path.color;
      ctx.lineWidth = path.size;
      ctx.moveTo(path.points[0].x, path.points[0].y);
      path.points.forEach(point => ctx.lineTo(point.x, point.y));
      ctx.stroke();
    });
    memos.forEach(drawMemo);
  }

  function drawMemo(memo) {
    // Draw memo background
    ctx.fillStyle = "purple";
    ctx.fillRect(memo.x, memo.y, memo.width, memo.height);
    // Draw memo text
    ctx.fillStyle = "white";
    ctx.font = `${memo.fontSize}px Arial`;
    ctx.fillText(memo.text, memo.x + 10, memo.y + memo.fontSize + 5, memo.width - 20);
    // Draw resize handle
    ctx.fillStyle = "orange";
    ctx.fillRect(memo.x + memo.width - 10, memo.y + memo.height - 10, 10, 10);
  }

  function eraseDrawing(x, y) {
    const eraseRadius = 10;
    drawings.forEach(path => {
      path.points = path.points.filter(point => {
        const dx = point.x - x;
        const dy = point.y - y;
        return Math.sqrt(dx * dx + dy * dy) > eraseRadius;
      });
    });
    drawings.filter(path => path.points.length > 0);
    drawCanvas();
  }

  canvas.addEventListener("mousedown", (e) => {
    const { x, y } = getCanvasCoordinates(e);

    if (tool === "pen") {
      drawing = true;
      drawings.push({ color: "purple", size: 2, points: [{ x, y }] });
    } else if (tool === "eraser") {
      erasing = true;
      eraseDrawing(x, y);
    } else if (tool === "text") {
      const text = prompt("Enter your text:");
      if (text) {
        memos.push({ x, y, width: 150, height: 50, text, fontSize: 16 });
        drawCanvas();
      }
    } else if (tool === "cursor") {
      selectedMemo = memos.find(memo =>
        x >= memo.x && x <= memo.x + memo.width &&
        y >= memo.y && y <= memo.y + memo.height
      );

      if (selectedMemo) {
        if (x >= selectedMemo.x + selectedMemo.width - 10 &&
          y >= selectedMemo.y + selectedMemo.height - 10) {
          resizingMemo = true;
        } else {
          offsetX = x - selectedMemo.x;
          offsetY = y - selectedMemo.y;
        }
      }
    }
  });

  canvas.addEventListener("mousemove", (e) => {
    const { x, y } = getCanvasCoordinates(e);

    if (drawing && tool === "pen") {
      const currentPath = drawings[drawings.length - 1];
      currentPath.points.push({ x, y });
      drawCanvas();
    } else if (erasing && tool === "eraser") {
      eraseDrawing(x, y);
    } else if (tool === "cursor" && selectedMemo) {
      if (resizingMemo) {
        selectedMemo.width = Math.max(50, x - selectedMemo.x);
        selectedMemo.height = Math.max(30, y - selectedMemo.y);
      } else {
        selectedMemo.x = x - offsetX;
        selectedMemo.y = y - offsetY;
      }
      drawCanvas();
    }
  });

  canvas.addEventListener("mouseup", () => {
    drawing = false;
    erasing = false;
    selectedMemo = null;
    resizingMemo = false;
  });

  document.getElementById("toolbarSection").addEventListener("click", (e) => {
    const clickedTool = e.target.closest(".tool");
    if (clickedTool) {
      toolIcons.forEach(icon => icon.classList.remove("active"));
      clickedTool.classList.add("active");
      tool = clickedTool.id.replace("Tool", "").toLowerCase();
    }
  });
</script>

{% endblock %}
