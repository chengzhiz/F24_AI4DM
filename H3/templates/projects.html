{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
  <h2 class="mb-4">Available Projects</h2>
  <div class="row">
    {% for project in projects %}
    <div class="col-md-4 mb-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">{{ project.name }}</h5>
          <p class="card-text">Project ID: {{ project.id }}</p>
          <form action="{{ url_for('join_project') }}" method="POST">
            <input type="hidden" name="project_id" value="{{ project.id }}">
            <div class="mb-3">
              <input type="password" name="password" class="form-control" placeholder="Enter project password" required>
            </div>
            <button type="submit" class="btn btn-purple w-100">Join Project</button>
          </form>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
